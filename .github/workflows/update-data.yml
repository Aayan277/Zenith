name: Update satellite data

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch TLEs
        run: node scripts/fetch-sats.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/sats.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "zenith-data-bot"
          git config user.email "zenith-data-bot@users.noreply.github.com"
          git add data/sats.json
          git commit -m "chore(data): refresh satellite TLEs "
          git push
