name: Deploy to GitHub Pages

# Deploys the static site. Satellite orbits (TLEs) go stale in a few days, so the
# site is also rebuilt every 6 hours with fresh data fetched at build time.
# Fresh data is written only into the deployed site, not committed, which keeps
# the git history small. The committed data/sats.json is a fallback snapshot.
#
# `test` (Playwright smoke suite, tests/) gates `deploy` on pushes and manual runs. The 6-hourly scheduled
# refresh skips the tests on purpose: it redeploys the same commit that already passed on push, with only
# the data files replaced (and the data fetchers are continue-on-error), so a ~5 min browser run every 6 h
# would add cost without catching anything new. Run it manually (workflow_dispatch) when in doubt.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Smoke tests
        # Tracing/screenshots/video are off in tests/playwright.config.mjs. External APIs are mocked from tests/fixtures.
        run: npm test
      - name: Upload Playwright HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    needs: test
    # `test` is skipped on the schedule: still deploy then, but never when it failed or the run was cancelled.
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Assemble site
        run: |
          mkdir -p _site/data/sky
          cp -r index.html sw.js css js assets _site/
          cp data/sats.json data/sats-core.json data/launches.json data/spacecraft.json _site/data/
          cp data/sky/sky.json data/sky/constellations.json data/sky/dso.json _site/data/sky/
          touch _site/.nojekyll
      - name: Fetch fresh satellite data
        # If CelesTrak (and the fallback) are down, keep the committed snapshot.
        continue-on-error: true
        # Writes both _site/data/sats.json and _site/data/sats-core.json.
        run: node scripts/fetch-sats.mjs --out _site/data/sats.json
      - name: Fetch fresh launch schedule
        continue-on-error: true
        run: node scripts/fetch-launches.mjs --out _site/data/launches.json
      - name: Fetch fresh spacecraft positions (JPL Horizons)
        continue-on-error: true
        run: node scripts/fetch-spacecraft.mjs --out _site/data/spacecraft.json
      - name: Minify JS and CSS (per file, module structure unchanged)
        run: |
          cd _site
          npx --yes esbuild@0.24.0 $(find js -name '*.js') sw.js --minify --target=es2020 --outdir=. --allow-overwrite --log-level=warning
          npx --yes esbuild@0.24.0 css/*.css --minify --outdir=css --allow-overwrite --log-level=warning
      - name: Stamp service worker cache version
        run: sed -i "s/__BUILD__/${GITHUB_SHA::12}-${GITHUB_RUN_ID}/" _site/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
